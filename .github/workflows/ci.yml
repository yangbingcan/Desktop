# GitHub Actions CI 配置文件
#
# 这个文件的作用：每次你 push 代码到 GitHub，或提交 Pull Request 时，
# GitHub 会自动启动一台云端服务器，帮你运行所有测试。
# 只有所有测试都通过，代码才能合并到主分支。
#
# 相当于一个 24 小时值班的自动化质检员，防止有问题的代码被合并。
#
# 工作流程：
# 1. 代码推送到 GitHub
# 2. GitHub 自动启动 runner（Ubuntu Linux 服务器）
# 3. 安装项目依赖（Node.js + Rust）
# 4. 运行前端测试（Vitest 单元测试 + Playwright E2E 测试）
# 5. 运行后端测试（cargo test）
# 6. 所有测试通过 → ✅ 绿色对勾；任一失败 → ❌ 红色叉号
#
# 触发条件：
# - push 到 main/master 分支
# - 提交 Pull Request 到 main/master 分支
name: CI 自动化测试

on:
  # 推送到 main 或 master 分支时触发
  push:
    branches: [main, master]
  # 提交 Pull Request 时触发
  pull_request:
    branches: [main, master]

# 同时只允许一个 CI 任务运行，避免重复构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== 前端测试 ====================
  frontend-tests:
    name: 前端测试（Vitest + Playwright）
    runs-on: ubuntu-latest  # 使用 Ubuntu Linux 运行环境

    steps:
      # 步骤1：拉取代码到 runner
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤2：安装 Node.js（前端需要）
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 使用 LTS 长期支持版本
          cache: 'npm'        # 启用 npm 缓存，加速后续安装
          cache-dependency-path: tea-manage/package-lock.json

      # 步骤3：安装前端依赖
      - name: 安装前端依赖
        working-directory: tea-manage
        run: npm ci  # ci 比 install 更严格，适合 CI 环境

      # 步骤4：安装 Playwright 浏览器（E2E 测试需要）
      - name: 安装 Playwright 浏览器
        working-directory: tea-manage
        run: npx playwright install --with-deps chromium

      # 步骤5：运行 TypeScript 类型检查
      - name: TypeScript 类型检查
        working-directory: tea-manage
        run: npx vue-tsc --noEmit

      # 步骤6：运行前端单元测试（Vitest）
      - name: 运行前端单元测试
        working-directory: tea-manage
        run: npm run test:unit

      # 步骤7：运行 E2E 测试（Playwright）
      - name: 运行 E2E 测试
        working-directory: tea-manage
        run: npm run test:e2e

      # 步骤8：上传测试报告（失败时保留证据）
      - name: 上传测试报告
        if: always()  # 即使前面的步骤失败也执行
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tea-manage/playwright-report/
          retention-days: 7  # 保留 7 天

  # ==================== 后端测试 ====================
  backend-tests:
    name: 后端测试（cargo test）
    runs-on: ubuntu-latest

    steps:
      # 步骤1：拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤2：安装 Rust 工具链（后端需要）
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 步骤3：安装 SQLite 开发库（项目依赖）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 步骤4：缓存 Rust 编译产物（加速后续构建）
      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            tea-manage/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('tea-manage/src-tauri/Cargo.lock') }}

      # 步骤5：编译检查（确保代码能编译通过）
      - name: 编译检查
        working-directory: tea-manage
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # 步骤6：运行后端单元测试
      - name: 运行后端单元测试
        working-directory: tea-manage
        run: cargo test --manifest-path src-tauri/Cargo.toml
